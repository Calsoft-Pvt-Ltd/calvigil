name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Needed only if you use GITHUB_TOKEN for gist updates (not applicable here;
  # we use a separate GIST_SECRET PAT). Keeping minimal permissions.

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run go vet
        run: go vet ./...

  # ── Unit Tests + Coverage ─────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests with coverage
        run: go test -v -race -count=1 -coverprofile=coverage.out -covermode=atomic ./internal/... ./cmd/...

      - name: Display coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $NF}' | tr -d '%')
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "## 📊 Code Coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Update coverage badge (gist)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 324db294e044d1f67f4780812e1bbf17
          filename: calvigil-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.coverage }}%
          valColorRange: ${{ steps.coverage.outputs.coverage }}
          minColorRange: 50
          maxColorRange: 90

      - name: Fail if coverage below 80%
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets the 80% threshold ✓"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

  # ── Integration Tests ────────────────────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o bin/calvigil .

      - name: Run integration tests
        run: go test -v -tags integration -timeout 10m -count=1 ./tests/integration/

  # ── Build Matrix ─────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          SUFFIX="${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then SUFFIX="${SUFFIX}.exe"; fi
          go build -trimpath -o "bin/calvigil-${SUFFIX}" .
          echo "Built bin/calvigil-${SUFFIX}"
