title: Calvigil
description: AI-Powered Vulnerability Scanner CLI
baseurl: "/calvigil"
url: "https://Calsoft-Pvt-Ltd.github.io"

logo: "/calvigil/assets/images/calvigil-logo.png"

remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: light

permalink: pretty

aux_links:
  "GitHub":
    - "https://github.com/Calsoft-Pvt-Ltd/calvigil"

aux_links_new_tab: true

nav_sort: case_insensitive

heading_anchors: true

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/

callouts:
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: red

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Copyright &copy; 2026 Calsoft Pvt Ltd. Distributed under the <a href=\"https://github.com/Calsoft-Pvt-Ltd/calvigil/blob/main/LICENSE\">MIT License</a>."

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

exclude:
  - HLD.md
  - LLD.md
  - KNOWLEDGE_GRAPH.json
  - KNOWLEDGE_GRAPH.md
  - Gemfile
  - Gemfile.lock
